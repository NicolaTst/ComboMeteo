
name: Crea APK ComboMeteo

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v5

      - name: Installa Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepara Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          unzip -q gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Verifica Android SDK
        run: |
          echo "Android SDK:"
          ls "$ANDROID_HOME/platforms"
          echo "Build tools:"
          ls "$ANDROID_HOME/build-tools"

      - name: Compila ComboMeteo
        run: gradle assembleDebug

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: ComboMeteo-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
